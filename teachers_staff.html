<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAVYA — Teachers & Staff</title></head><body><div id="app"></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script><script src="firebase-config.js"></script><script src="navya_core.js"></script><script src="navya_data.js"></script><script src="navya_ui.js"></script><script>const s=NAVYA_UI.protect(["OWNER","ADMIN","HOD"]);if(s){document.getElementById('app').innerHTML=NAVYA_UI.shell("Teachers & Staff",s.role,s)+`<section class="card" style="margin-top:22px"><h2>Add</h2><form id="form" class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div><label>Name</label><input class="input" id="name" placeholder="Name"></div><div><label>Email</label><input class="input" id="email" placeholder="Email"></div><div><label>Mobile</label><input class="input" id="mobile" placeholder="Mobile"></div><div><label>Role</label><input class="input" id="role" placeholder="Role"></div><div><label>Subject</label><input class="input" id="subject" placeholder="Subject"></div><button class="btn" type="submit">Save</button></form><div id="msg" class="muted" style="margin-top:10px"></div></section><section class="card" style="margin-top:16px;overflow:auto"><h2>Records</h2><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Mobile</th><th>Role</th><th>Subject</th><th></th></tr></thead><tbody id="rows"></tbody></table></section>`+NAVYA_UI.close();load();}</script><script>async function load(){try{const a=await NAVYA_DATA.list('teachers');rows.innerHTML=a.map(x=>'<tr>'+[["Name","name"],["Email","email"],["Mobile","mobile"],["Role","role"],["Subject","subject"]].map(f=>'<td>'+String(x[f[1]]??'')+'</td>').join('')+'<td><button class="btn secondary" onclick="removeRecord(\''+x.id+'\')">Delete</button></td></tr>').join('')}catch(e){msg.textContent=e.message}}async function removeRecord(id){if(confirm('Delete this record?')){await NAVYA_DATA.remove('teachers',id);await NAVYA_DATA.audit('DELETE','teachers',id);load()}}document.addEventListener('submit',async e=>{if(e.target.id!=='form')return;e.preventDefault();try{const d={};[["Name","name"],["Email","email"],["Mobile","mobile"],["Role","role"],["Subject","subject"]].forEach(f=>d[f[1]]=document.getElementById(f[1]).value.trim());await NAVYA_DATA.add('teachers',d);await NAVYA_DATA.audit('CREATE','teachers',null,d.title||d.name||'');e.target.reset();load();msg.textContent='Saved successfully.'}catch(x){msg.textContent=x.message}})</script></body></html>
