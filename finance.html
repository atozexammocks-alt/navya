<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAVYA — Finance</title></head><body><div id="app"></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script src="navya_core.js"></script><script src="navya_data.js"></script><script src="navya_ui.js"></script><script>const s=NAVYA_UI.protect(["OWNER","ADMIN","ACCOUNTANT"]);if(s){document.getElementById('app').innerHTML=NAVYA_UI.shell("Finance",s.role,s)+`<section class="card" style="margin-top:22px"><form id="f" class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div><label>Entry</label><input class="input" id="entry" placeholder="Entry"></div><div><label>Student / Party</label><input class="input" id="party" placeholder="Student / Party"></div><div><label>Amount</label><input class="input" id="amount" placeholder="Amount"></div><div><label>Type</label><input class="input" id="type" placeholder="Type"></div><div><label>Date</label><input class="input" id="date" placeholder="Date"></div><button class="btn" type="submit">Save</button></form><p id="m" class="muted"></p></section><section class="card" style="margin-top:16px;overflow:auto"><table class="table"><thead><tr><th>Entry</th><th>Student / Party</th><th>Amount</th><th>Type</th><th>Date</th><th>Action</th></tr></thead><tbody id="r"></tbody></table></section>`+NAVYA_UI.close();load()}async function load(){try{const a=await NAVYA_DATA.list('finance');r.innerHTML=a.map(x=>'<tr>'+[["Entry","entry"],["Student / Party","party"],["Amount","amount"],["Type","type"],["Date","date"]].map(f=>'<td>'+String(x[f[1]]??'')+'</td>').join('')+'<td><button class="btn secondary" onclick="del(\''+x.id+'\')">Delete</button></td></tr>').join('')}catch(e){m.textContent=e.message}}async function del(id){if(confirm('Delete?')){await NAVYA_DATA.remove('finance',id);load()}}f.onsubmit=async e=>{e.preventDefault();try{const d={};[["Entry","entry"],["Student / Party","party"],["Amount","amount"],["Type","type"],["Date","date"]].forEach(x=>d[x[1]]=document.getElementById(x[1]).value.trim());await NAVYA_DATA.add('finance',d);e.target.reset();m.textContent='Saved.';load()}catch(x){m.textContent=x.message}}</script></body></html>
