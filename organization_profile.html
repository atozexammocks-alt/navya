<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAVYA — Organization Profile</title><style>body{font-family:Inter,system-ui,sans-serif;background:#f6f8fb;color:#172033;margin:0}.wrap{max-width:1000px;margin:28px auto;padding:0 18px}.card{background:#fff;border:1px solid #e5e9f0;border-radius:18px;padding:24px;box-shadow:0 6px 24px rgba(20,30,50,.05)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:700px){.grid{grid-template-columns:1fr}}label{display:block;font-size:13px;font-weight:650;margin:0 0 7px;color:#475467}input,select{width:100%;box-sizing:border-box;border:1px solid #d8dee8;border-radius:10px;padding:11px 12px;font:inherit}button{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;background:#172033;color:#fff}.muted{color:#667085;font-size:14px}.actions{margin-top:18px}.msg{margin-top:10px;font-size:14px}</style></head><body><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script src="navya_core.js"></script><script src="navya_ui.js"></script><script src="navya_data.js"></script><script>(async()=>{const s=NAVYA_UI.protect(['OWNER','ADMIN']);if(!s)return;document.body.innerHTML=NAVYA_UI.shell('Organization Profile',s.role,s)+'<div class="wrap"><div class="card"><h2>Organization profile</h2><p class="muted">Manage your institution identity and contact details.</p><form id="f"><div class="grid"><div><label>Institution name</label><input id="name" required></div><div><label>Institution type</label><select id="type"><option>School</option><option>Coaching Institute</option><option>College</option><option>University</option><option>Training Centre</option><option>Other</option></select></div><div><label>Institution code</label><input id="code" readonly></div><div><label>Owner / director</label><input id="owner" readonly></div><div><label>Work email</label><input id="email" type="email"></div><div><label>Phone</label><input id="phone"></div><div><label>Website</label><input id="website" placeholder="https://example.com"></div><div><label>City</label><input id="city"></div></div><div class="actions"><button>Save changes</button><div id="msg" class="msg"></div></div></form></div></div>'+NAVYA_UI.close();const d=await NAVYA.firebase().db.collection('organizations').doc(s.organizationId).get();if(!d.exists){msg.textContent='Organization not found.';return}const o=d.data();name.value=o.name||'';type.value=o.type||'School';code.value=o.code||'';owner.value=o.ownerName||'';email.value=o.email||'';phone.value=o.phone||'';website.value=o.website||'';city.value=o.city||'';f.onsubmit=async e=>{e.preventDefault();msg.textContent='Saving...';try{await NAVYA_DATA.update('organizations',s.organizationId,{name:name.value.trim(),type:type.value,email:email.value.trim(),phone:phone.value.trim(),website:website.value.trim(),city:city.value.trim()});msg.textContent='Saved successfully.';await NAVYA_DATA.audit('UPDATE','organization',s.organizationId,'Organization profile updated');}catch(x){msg.textContent=x.message||'Save failed.'}}})()</script></body></html>
