<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAVYA — Secure Access</title><style>body{margin:0;background:#f5f7fb;color:#172033;font-family:Inter,system-ui}.wrap{max-width:560px;margin:50px auto;padding:20px}.card{background:white;border:1px solid #e4e7ec;border-radius:22px;padding:30px;box-shadow:0 15px 40px #10182812}.logo{font-size:28px;font-weight:900;letter-spacing:.12em}h1{margin:22px 0 8px}p{color:#667085;line-height:1.5}.step{display:none}.step.active{display:block}label{display:block;font-size:13px;font-weight:700;margin:16px 0 7px}input,select{width:100%;padding:13px;border:1px solid #d0d5dd;border-radius:10px;font:inherit;box-sizing:border-box}.btn{width:100%;border:0;border-radius:10px;padding:13px;margin-top:18px;font-weight:800;cursor:pointer}.primary{background:#4f46e5;color:white}.secondary{background:#eef2ff;color:#3730a3}.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.role{padding:13px;border:1px solid #d0d5dd;border-radius:12px;background:white;cursor:pointer;font-weight:700}.role.selected{border-color:#4f46e5;background:#eef2ff}.err{display:none;margin-top:12px;padding:10px;background:#fef3f2;color:#b42318;border-radius:9px;font-size:13px}.ok{display:none;margin-top:12px;padding:10px;background:#ecfdf3;color:#067647;border-radius:9px;font-size:13px}.back{margin-top:16px;text-align:center;font-size:13px;color:#4f46e5;cursor:pointer}</style></head><body><div class="wrap"><div class="card"><div class="logo">NAVYA</div><p>Institute-first secure access.</p>
<div id="s1" class="step active"><h1>Who are you?</h1><p>First choose the access path.</p><button class="btn primary" onclick="superStart()">Super Admin</button><button class="btn secondary" onclick="instStart()">Registered Institute</button><div class="back" onclick="location.href='index.html'">← Home</div></div>
<div id="ss" class="step"><h1>Super Admin</h1><p>Vikas Attri · vikasattri3003@gmail.com</p><label>6–8 digit PIN</label><input id="spin" type="password" inputmode="numeric" maxlength="8" placeholder="Enter PIN"><button class="btn primary" onclick="superLogin()">Enter NAVYA</button><button class="btn secondary" onclick="setupPin()">Set / Reset PIN</button><div id="e2" class="err"></div><div id="o2" class="ok"></div><div class="back" onclick="go(1)">← Back</div></div>
<div id="si" class="step"><h1>Registered Institute</h1><label>Institute Name / Code</label><input id="org" placeholder="e.g. ABC-1234 or institute name"><button class="btn primary" onclick="nextRole()">Continue</button><div id="e1" class="err"></div><div class="back" onclick="go(1)">← Back</div></div>
<div id="sr" class="step"><h1>Select your role</h1><p id="orgLabel"></p><div class="roles" id="roles"></div><button class="btn primary" onclick="nextLogin()">Continue</button><div class="back" onclick="go(2)">← Back</div></div>
<div id="sl" class="step"><h1>Organization Login</h1><p id="loginLabel"></p><label>Email / Mobile</label><input id="identity"><label>Password / PIN</label><input id="pass" type="password"><button class="btn primary" onclick="orgLogin()">Login</button><div id="e3" class="err"></div><div class="back" onclick="go(3)">← Change role</div></div>
</div></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script><script src="firebase-config.js"></script><script src="navya_core.js"></script><script>
let orgObj=null,role=null;function go(n){document.querySelectorAll('.step').forEach(x=>x.classList.remove('active'));document.getElementById(['s1','ss','si','sr','sl'][n-1]||'s1').classList.add('active')}
function superStart(){go(2)}function instStart(){go(3)}
async function setupPin(){const p=prompt('Set a new Super Admin PIN (6–8 digits):');if(p===null)return;const r=await NAVYA.setupSuperPin(p);if(r.ok){show('o2',r.verificationSent?'PIN created. Check the Super Admin email and verify it before login.':'Super Admin PIN saved.');}else show('e2',r.error)}
async function superLogin(){const r=await NAVYA.loginSuper(document.getElementById('spin').value);if(!r.ok){show('e2',r.error);return}location.href='super_admin_dashboard.html'}
async function nextRole(){orgObj=await NAVYA.findOrganizationFirebase(document.getElementById('org').value);if(!orgObj){show('e1','Institute not found. Register the institute first.');return}document.getElementById('orgLabel').textContent=orgObj.name+' · '+orgObj.code;document.getElementById('roles').innerHTML=NAVYA.rolesFor(orgObj).map(r=>'<button class="role" onclick="pick(this,\\''+r+'\\')">'+r.replace('_',' ')+'</button>').join('');go(4)}
function pick(el,r){role=r;document.querySelectorAll('.role').forEach(x=>x.classList.remove('selected'));el.classList.add('selected')}
function nextLogin(){if(!role){alert('Select a role first.');return}document.getElementById('loginLabel').textContent=orgObj.name+' · '+role.replace('_',' ');go(5)}
async function orgLogin(){const r=await NAVYA.loginOrganization(document.getElementById('identity').value,document.getElementById('pass').value,orgObj.code,role);if(!r.ok){show('e3',r.error);return}const map={OWNER:'owner_dashboard.html',ADMIN:'admin_dashboard.html',HOD:'hod_dashboard.html',TEACHER:'teacher_dashboard.html',STUDENT:'student_dashboard.html',PARENT:'parent_dashboard.html',ACCOUNTANT:'accountant_dashboard.html',COUNSELOR:'counselor_dashboard.html'};location.href=map[role]||'institute_dashboard.html'}
function show(id,msg){document.getElementById(id).textContent=msg;document.getElementById(id).style.display='block'}
</script></body></html>
