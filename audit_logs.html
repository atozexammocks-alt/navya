<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAVYA — Audit Logs</title></head><body><div id="app"></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script src="navya_core.js"></script><script src="navya_data.js"></script><script src="navya_ui.js"></script><script>const s=NAVYA_UI.protect(["SUPER_ADMIN","OWNER","ADMIN","HOD"]);if(s){document.getElementById('app').innerHTML=NAVYA_UI.shell("Audit Logs",s.role,s)+"<section class=\"card\" style=\"margin-top:22px\"><h2>Activity History</h2><div id=\"log\" class=\"muted\">Loading…</div><table class=\"table\"><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Entity</th><th>Details</th></tr></thead><tbody id=\"rows\"></tbody></table></section><script>(async()=>{try{const a=await NAVYA_DATA.list('auditLogs');rows.innerHTML=a.sort((x,y)=>String(y.createdAt).localeCompare(String(x.createdAt))).map(x=>'<tr><td>'+((x.createdAt&&x.createdAt.toDate)?x.createdAt.toDate().toLocaleString():'')+'</td><td>'+ (x.actor||'')+'</td><td>'+ (x.action||'')+'</td><td>'+ (x.entity||'')+'</td><td>'+ (x.details||'')+'</td></tr>').join('');log.textContent=a.length+' events'}catch(e){log.textContent=e.message}})()</script>"+NAVYA_UI.close();}</script></body></html>
