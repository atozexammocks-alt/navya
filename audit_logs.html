<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAVYA — Audit Logs</title></head><body><div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script src="navya_core.js"></script><script src="navya_data.js"></script><script src="navya_ui.js"></script>
<script>
const s=NAVYA_UI.protect(["SUPER_ADMIN","OWNER","ADMIN","HOD"]);
function esc(v){return String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
if(s){
 document.getElementById('app').innerHTML=NAVYA_UI.shell("Audit Logs",s.role,s)+
 '<section class="card" style="margin-top:22px"><h2>Activity History</h2><div id="log" class="muted">Loading…</div><div style="overflow:auto"><table class="table"><thead><tr><th>Time</th><th>Actor</th><th>Email</th><th>Organization</th><th>Action</th><th>Entity</th><th>Page</th><th>Details</th></tr></thead><tbody id="rows"></tbody></table></div></section>'+NAVYA_UI.close();
 (async()=>{try{
   const a=await NAVYA_DATA.list('auditLogs');
   a.sort((x,y)=>String(y.createdAt).localeCompare(String(x.createdAt)));
   document.getElementById('rows').innerHTML=a.map(x=>'<tr><td>'+((x.createdAt&&x.createdAt.toDate)?x.createdAt.toDate().toLocaleString():'')+'</td><td>'+esc(x.actor)+'</td><td>'+esc(x.actorEmail)+'</td><td>'+esc(x.organizationId||'Platform')+'</td><td>'+esc(x.action)+'</td><td>'+esc(x.entity)+'</td><td>'+esc(x.page)+'</td><td>'+esc(x.details)+'</td></tr>').join('');
   document.getElementById('log').textContent=a.length+' events';
 }catch(e){document.getElementById('log').textContent=e.message||'Could not load audit logs.'}})
}
</script></body></html>
