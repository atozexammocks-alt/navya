<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAVYA — Results</title></head><body><div id="app"></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script src="navya_core.js"></script><script src="navya_data.js"></script><script src="navya_ui.js"></script><script>const s=NAVYA_UI.protect(["OWNER","ADMIN","HOD","TEACHER","STUDENT","PARENT"]);if(s){document.getElementById('app').innerHTML=NAVYA_UI.shell("Results",s.role,s)+`<section class="card" style="margin-top:22px"><form id="f" class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div><label>Student</label><input class="input" id="student" placeholder="Student"></div><div><label>Exam</label><input class="input" id="exam" placeholder="Exam"></div><div><label>Marks</label><input class="input" id="marks" placeholder="Marks"></div><div><label>Percentage</label><input class="input" id="percentage" placeholder="Percentage"></div><div><label>Remarks</label><input class="input" id="remarks" placeholder="Remarks"></div><button class="btn" type="submit">Save</button></form><p id="m" class="muted"></p></section><section class="card" style="margin-top:16px;overflow:auto"><table class="table"><thead><tr><th>Student</th><th>Exam</th><th>Marks</th><th>Percentage</th><th>Remarks</th><th>Action</th></tr></thead><tbody id="r"></tbody></table></section>`+NAVYA_UI.close();load()}async function load(){try{const a=await NAVYA_DATA.list('results');r.innerHTML=a.map(x=>'<tr>'+[["Student","student"],["Exam","exam"],["Marks","marks"],["Percentage","percentage"],["Remarks","remarks"]].map(f=>'<td>'+String(x[f[1]]??'')+'</td>').join('')+'<td><button class="btn secondary" onclick="del(\''+x.id+'\')">Delete</button></td></tr>').join('')}catch(e){m.textContent=e.message}}async function del(id){if(confirm('Delete?')){await NAVYA_DATA.remove('results',id);load()}}f.onsubmit=async e=>{e.preventDefault();try{const d={};[["Student","student"],["Exam","exam"],["Marks","marks"],["Percentage","percentage"],["Remarks","remarks"]].forEach(x=>d[x[1]]=document.getElementById(x[1]).value.trim());await NAVYA_DATA.add('results',d);e.target.reset();m.textContent='Saved successfully';load()}catch(x){m.textContent=x.message}}</script></body></html>
