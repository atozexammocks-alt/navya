<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAVYA — Organization Setup</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f8fb;color:#172033;font-family:Inter,system-ui,sans-serif}.top{height:68px;background:#fff;border-bottom:1px solid #e4e7ec;display:flex;align-items:center;justify-content:space-between;padding:0 24px}.logo{font-weight:900;letter-spacing:.1em;font-size:24px}.user{font-size:13px;color:#667085}.wrap{max-width:900px;margin:35px auto;padding:0 20px}h1{font-size:34px;margin:0 0 7px}.muted{color:#667085;line-height:1.55}.card{background:#fff;border:1px solid #e4e7ec;border-radius:17px;padding:22px;margin-top:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.step{padding:16px;border:1px solid #e4e7ec;border-radius:13px}.step b{display:block;margin-bottom:5px}.step span{font-size:13px;color:#667085}label{display:block;font-size:13px;font-weight:750;margin:14px 0 7px}input,select{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:9px;font:inherit}button{border:0;border-radius:9px;padding:11px 15px;background:#4f46e5;color:#fff;font-weight:800;cursor:pointer;margin-top:16px}.secondary{background:#f2f4f7;color:#344054}.msg{margin-top:12px;color:#067647;font-size:13px}@media(max-width:650px){.grid{grid-template-columns:1fr}.wrap{margin:25px auto;padding:0 14px}}</style></head><body><header class="top"><div><div class="logo">NAVYA</div><div style="font-size:10px;color:#98a2b3">ORGANIZATION SETUP</div></div><div class="user" id="who"></div></header><main class="wrap"><div id="content"></div></main><script src="navya_core.js"></script><script>
const s=NAVYA.requireSession();if(s){const o=NAVYA.organization();who.textContent=(o?.name||'Organization')+' • '+s.role;content.innerHTML=`<h1>Set up your institute</h1><p class="muted">Private workspace for <b>${o?.name||'your organization'}</b>. Organization ID is attached to the authenticated session.</p><div class="card"><h2>Organization Profile</h2><div class="grid"><div><label>Institute Name</label><input id="name" value="${o?.name||''}"></div><div><label>Institute Type</label><select id="type"><option>School</option><option>Coaching Institute</option><option>College</option><option>University</option><option>Training Centre</option></select></div><div><label>Email</label><input id="email" value="${o?.email||''}"></div><div><label>Mobile</label><input id="mobile" value="${o?.mobile||''}"></div></div><button onclick="save()">Save Organization</button><button class="secondary" onclick="location.href='institute_dashboard.html'">Continue to Dashboard</button><div id="msg" class="msg"></div></div><div class="card"><h2>Setup Roadmap</h2><div class="grid"><div class="step"><b>1 ✓ Organization Profile</b><span>Identity and contact details</span></div><div class="step"><b>2 Academic Structure</b><span>Sessions, classes, batches, subjects</span></div><div class="step"><b>3 Staff & Teachers</b><span>Invite users and assign roles</span></div><div class="step"><b>4 Students</b><span>Add/import and assign students</span></div></div></div>`}function save(){const r=NAVYA.updateOrganization({name:name.value,type:type.value,email:email.value,mobile:mobile.value});msg.textContent=r.ok?'Organization saved.':'Unable to save.'}
</script></body></html>
