<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAVYA — Users & Roles</title></head><body><div id="app"></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script src="navya_core.js"></script><script src="navya_data.js"></script><script src="navya_ui.js"></script><script>const s=NAVYA_UI.protect(["SUPER_ADMIN"]);if(s){document.getElementById('app').innerHTML=NAVYA_UI.shell("Users & Roles",s.role,s)+"<section class=\"card\" style=\"margin-top:22px\"><h2>Platform Users</h2><form id=\"f\" class=\"grid\" style=\"grid-template-columns:repeat(2,minmax(0,1fr))\"><div><label>Name</label><input class=\"input\" id=\"name\"  placeholder=\"Name\"></div><div><label>Email</label><input class=\"input\" id=\"email\"  placeholder=\"Email\"></div><div><label>Role</label><input class=\"input\" id=\"role\"  placeholder=\"Role\"></div><div><label>Organization ID</label><input class=\"input\" id=\"organizationId\"  placeholder=\"Organization ID\"></div><button class=\"btn\" type=\"submit\">Add record</button></form></section><section class=\"card\" style=\"margin-top:16px;overflow:auto\"><div id=\"msg\" class=\"muted\">Loading…</div><table class=\"table\"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Organization ID</th><th>Action</th></tr></thead><tbody id=\"rows\"></tbody></table></section><script>(async()=>{const fields=[[\"Name\",\"name\"],[\"Email\",\"email\"],[\"Role\",\"role\"],[\"Organization ID\",\"organizationId\"]];const rows=document.getElementById('rows'),msg=document.getElementById('msg');async function load(){try{const a=await NAVYA_DATA.list('users_admin');msg.textContent=a.length+' records';rows.innerHTML=a.map(x=>'<tr>'+fields.map(f=>'<td>'+(x[f[1]]??'')+'</td>').join('')+'<td><button class=\"btn secondary\" onclick=\"del(\\''+x.id+'\\')\">Delete</button></td></tr>').join('')}catch(e){msg.textContent=e.message}}window.del=async id=>{if(confirm('Delete this record?')){await NAVYA_DATA.remove('users_admin',id);await load()}};document.getElementById('f').onsubmit=async e=>{e.preventDefault();try{const d={};fields.forEach(f=>d[f[1]]=document.getElementById(f[1]).value.trim());await NAVYA_DATA.add('users_admin',d);e.target.reset();await load()}catch(e){msg.textContent=e.message}};load()})()</script>"+NAVYA_UI.close();}</script></body></html>
