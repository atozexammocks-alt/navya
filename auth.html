<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAVYA — Login & Registration</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f8fb;color:#172033;font-family:Inter,system-ui,sans-serif}.wrap{min-height:100vh;display:grid;place-items:center;padding:22px}.box{width:min(470px,100%);background:#fff;border:1px solid #e4e7ec;border-radius:22px;padding:30px;box-shadow:0 18px 50px #10182814}.logo{font-weight:900;letter-spacing:.12em;font-size:25px}h1{font-size:27px;margin:18px 0 7px}.muted{color:#667085;font-size:14px;line-height:1.5}label{display:block;font-size:13px;font-weight:750;margin:15px 0 7px}input,select{width:100%;padding:13px;border:1px solid #d0d5dd;border-radius:10px;font:inherit}button{width:100%;padding:13px;border:0;border-radius:10px;background:#4f46e5;color:#fff;font-weight:800;cursor:pointer;margin-top:17px}.link{text-align:center;color:#4f46e5;font-size:13px;margin-top:17px;cursor:pointer}.error{display:none;background:#fef3f2;color:#b42318;border:1px solid #fecdca;padding:10px;border-radius:9px;font-size:13px;margin-top:15px}.note{margin-top:18px;padding:11px;border-radius:10px;background:#f8fafc;color:#667085;font-size:12px;line-height:1.45}</style></head><body><div class="wrap"><div class="box"><div class="logo">NAVYA</div><div id="form"></div><div id="error" class="error"></div><div class="note">Firebase Authentication + Firestore are enabled for this NAVYA build. Tenant access is enforced by Firebase Security Rules; browser storage is used only for page routing state.</div></div></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script src="navya_core.js"></script><script>
const form=document.getElementById('form'),err=document.getElementById('error');function E(x){err.textContent=x;err.style.display=x?'block':'none'}
function loginForm(){E('');form.innerHTML=`<h1>Institute Login</h1><p class="muted">Owner/Admin sign in. Teachers and students will later enter through their organization account.</p><label>Email / Mobile</label><input id="identity" placeholder="registered email or mobile"><label>Password / PIN</label><input id="password" type="password" placeholder="password or PIN"><button onclick="doLogin()">Login to NAVYA</button><div class="link" onclick="registerForm()">New institute? Register</div>`}
function registerForm(){E('');form.innerHTML=`<h1>Register Institute</h1><p class="muted">Create your organization and first Owner account.</p><label>Institute Name</label><input id="org" placeholder="ABC Coaching Institute"><label>Institute Type</label><select id="type"><option>School</option><option>Coaching Institute</option><option>College</option><option>University</option><option>Training Centre</option></select><label>Owner Name</label><input id="owner" placeholder="Owner / Director"><label>Email</label><input id="email" type="email" placeholder="owner@example.com"><label>Mobile</label><input id="mobile" placeholder="10-digit mobile"><label>Password / PIN</label><input id="pw" type="password" placeholder="Create password"><button onclick="doRegister()">Create Institute & Login</button><div class="link" onclick="loginForm()">Already registered? Login</div>`}
async function doLogin(){const r=await NAVYA.loginOrganization(identity.value,password.value,'', 'OWNER');if(!r.ok)return E(r.error);location.href='owner_dashboard.html'}
async function doRegister(){const r=await NAVYA.registerInstitute({name:org.value,type:type.value,owner:owner.value,email:email.value,mobile:mobile.value,password:pw.value});if(!r.ok)return E(r.error);alert('Institute created. A verification email has been sent to '+email.value+'. Verify it before entering NAVYA. Your institute code is '+r.organization.code);location.href='access.html'}
new URLSearchParams(location.search).get('mode')==='register'?registerForm():loginForm();
</script></body></html>
