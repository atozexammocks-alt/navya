<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAVYA — Central Library</title></head><body><div id="app"></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script src="navya_core.js"></script><script src="navya_data.js"></script><script src="navya_ui.js"></script><script>const s=NAVYA_UI.protect(["SUPER_ADMIN"]);if(s){document.getElementById('app').innerHTML=NAVYA_UI.shell("Central Library",s.role,s)+"<section class=\"card\" style=\"margin-top:22px\"><h2>Central Content Registry</h2><form id=\"f\" class=\"grid\" style=\"grid-template-columns:repeat(2,minmax(0,1fr))\"><div><label>Title</label><input class=\"input\" id=\"title\"  placeholder=\"Title\"></div><div><label>Subject</label><input class=\"input\" id=\"subject\"  placeholder=\"Subject\"></div><div><label>Type</label><input class=\"input\" id=\"type\"  placeholder=\"Type\"></div><div><label>Resource URL</label><input class=\"input\" id=\"url\"  placeholder=\"Resource URL\"></div><button class=\"btn\" type=\"submit\">Add record</button></form></section><section class=\"card\" style=\"margin-top:16px;overflow:auto\"><div id=\"msg\" class=\"muted\">Loading…</div><table class=\"table\"><thead><tr><th>Title</th><th>Subject</th><th>Type</th><th>Resource URL</th><th>Action</th></tr></thead><tbody id=\"rows\"></tbody></table></section><script>(async()=>{const fields=[[\"Title\",\"title\"],[\"Subject\",\"subject\"],[\"Type\",\"type\"],[\"Resource URL\",\"url\"]];const rows=document.getElementById('rows'),msg=document.getElementById('msg');async function load(){try{const a=await NAVYA_DATA.list('centralLibrary');msg.textContent=a.length+' records';rows.innerHTML=a.map(x=>'<tr>'+fields.map(f=>'<td>'+(x[f[1]]??'')+'</td>').join('')+'<td><button class=\"btn secondary\" onclick=\"del(\\''+x.id+'\\')\">Delete</button></td></tr>').join('')}catch(e){msg.textContent=e.message}}window.del=async id=>{if(confirm('Delete this record?')){await NAVYA_DATA.remove('centralLibrary',id);await load()}};document.getElementById('f').onsubmit=async e=>{e.preventDefault();try{const d={};fields.forEach(f=>d[f[1]]=document.getElementById(f[1]).value.trim());await NAVYA_DATA.add('centralLibrary',d);e.target.reset();await load()}catch(e){msg.textContent=e.message}};load()})()</script>"+NAVYA_UI.close();}</script></body></html>
