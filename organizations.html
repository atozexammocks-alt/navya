<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAVYA — Organizations</title></head><body><div id="app"></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script src="navya_core.js"></script><script src="navya_data.js"></script><script src="navya_ui.js"></script><script>const s=NAVYA_UI.protect(["SUPER_ADMIN"]);if(s){document.getElementById('app').innerHTML=NAVYA_UI.shell("Organizations",s.role,s)+`<section class="card" style="margin-top:22px"><div id="msg">Loading…</div><div style="overflow:auto"><table class="table"><thead><tr><th>Name</th><th>Code</th><th>Type</th><th>Owner</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></section>`+NAVYA_UI.close();(async()=>{try{const a=await NAVYA_DATA.list('organizations');msg.textContent=a.length+' organizations';rows.innerHTML=a.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.code)+'</td><td>'+esc(x.type)+'</td><td>'+esc(x.ownerId)+'</td><td><b>'+esc(x.status||'ACTIVE')+'</b></td><td><button onclick="toggleOrg(\''+x.id+'\',\''+((x.status||'ACTIVE')==='BLOCKED'?'ACTIVE':'BLOCKED')+'\')">'+((x.status||'ACTIVE')==='BLOCKED'?'Unblock':'Block')+'</button></td></tr>').join('');}catch(e){msg.textContent=e.message}})()}function esc(v){return String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}async function toggleOrg(id,status){try{await NAVYA_DATA.update('organizations',id,{status});location.reload()}catch(e){alert(e.message||'Could not update organization.')}}</script></body></html>
