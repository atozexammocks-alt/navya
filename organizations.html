<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAVYA — Organizations</title></head><body><div id="app"></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script src="navya_core.js"></script><script src="navya_data.js"></script><script src="navya_ui.js"></script><script>const s=NAVYA_UI.protect(["SUPER_ADMIN"]);if(s){document.getElementById('app').innerHTML=NAVYA_UI.shell("Organizations",s.role,s)+`<section class="card" style="margin-top:22px"><div id="msg">Loading…</div><div style="overflow:auto"><table class="table"><tbody id="rows"></tbody></table></div></section>`+NAVYA_UI.close();(async()=>{try{const a=await NAVYA_DATA.list('organizations');msg.textContent=a.length+' records';if(a.length){const keys=[...new Set(a.flatMap(x=>Object.keys(x)))].filter(k=>!['id','createdAt','updatedAt'].includes(k)).slice(0,8);rows.innerHTML='<tr>'+keys.map(k=>'<th>'+k+'</th>').join('')+'</tr>'+a.map(x=>'<tr>'+keys.map(k=>'<td>'+((x[k]&&x[k].toDate)?x[k].toDate().toLocaleString():(x[k]??''))+'</td>').join('')+'</tr>').join('')}}catch(e){msg.textContent=e.message}})()}</script></body></html>
