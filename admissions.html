<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAVYA — Admissions</title></head><body><div id="app"></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script src="navya_core.js"></script><script src="navya_data.js"></script><script src="navya_ui.js"></script><script>const s=NAVYA_UI.protect(["OWNER","ADMIN","ACCOUNTANT","COUNSELOR"]);if(s){document.getElementById('app').innerHTML=NAVYA_UI.shell("Admissions",s.role,s)+`<section class="card" style="margin-top:22px"><form id="f" class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div><label>Applicant</label><input class="input" id="name" placeholder="Applicant"></div><div><label>Course / Class</label><input class="input" id="course" placeholder="Course / Class"></div><div><label>Mobile</label><input class="input" id="mobile" placeholder="Mobile"></div><div><label>Status</label><input class="input" id="status" placeholder="Status"></div><div><label>Source</label><input class="input" id="source" placeholder="Source"></div><button class="btn" type="submit">Save</button></form><p id="m" class="muted"></p></section><section class="card" style="margin-top:16px;overflow:auto"><table class="table"><thead><tr><th>Applicant</th><th>Course / Class</th><th>Mobile</th><th>Status</th><th>Source</th><th>Action</th></tr></thead><tbody id="r"></tbody></table></section>`+NAVYA_UI.close();load()}async function load(){try{const a=await NAVYA_DATA.list('admissions');r.innerHTML=a.map(x=>'<tr>'+[["Applicant","name"],["Course / Class","course"],["Mobile","mobile"],["Status","status"],["Source","source"]].map(f=>'<td>'+String(x[f[1]]??'')+'</td>').join('')+'<td><button class="btn secondary" onclick="del(\''+x.id+'\')">Delete</button></td></tr>').join('')}catch(e){m.textContent=e.message}}async function del(id){if(confirm('Delete?')){await NAVYA_DATA.remove('admissions',id);load()}}f.onsubmit=async e=>{e.preventDefault();try{const d={};[["Applicant","name"],["Course / Class","course"],["Mobile","mobile"],["Status","status"],["Source","source"]].forEach(x=>d[x[1]]=document.getElementById(x[1]).value.trim());await NAVYA_DATA.add('admissions',d);e.target.reset();m.textContent='Saved successfully';load()}catch(x){m.textContent=x.message}}</script></body></html>
