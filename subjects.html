<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAVYA — Subjects</title></head><body><div id="app"></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script><script src="firebase-config.js"></script><script src="navya_core.js"></script><script src="navya_data.js"></script><script src="navya_ui.js"></script><script>const s=NAVYA_UI.protect(["OWNER","ADMIN","HOD","TEACHER","STUDENT"]);if(s){document.getElementById('app').innerHTML=NAVYA_UI.shell("Subjects",s.role,s)+`<section class="card" style="margin-top:22px"><h2>Add</h2><form id="form" class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div><label>Subject</label><input class="input" id="name" placeholder="Subject"></div><div><label>Code</label><input class="input" id="code" placeholder="Code"></div><div><label>Class</label><input class="input" id="className" placeholder="Class"></div><div><label>Department</label><input class="input" id="department" placeholder="Department"></div><button class="btn" type="submit">Save</button></form><div id="msg" class="muted" style="margin-top:10px"></div></section><section class="card" style="margin-top:16px;overflow:auto"><h2>Records</h2><table class="table"><thead><tr><th>Subject</th><th>Code</th><th>Class</th><th>Department</th><th></th></tr></thead><tbody id="rows"></tbody></table></section>`+NAVYA_UI.close();load();}</script><script>async function load(){try{const a=await NAVYA_DATA.list('subjects');rows.innerHTML=a.map(x=>'<tr>'+[["Subject","name"],["Code","code"],["Class","className"],["Department","department"]].map(f=>'<td>'+String(x[f[1]]??'')+'</td>').join('')+'<td><button class="btn secondary" onclick="removeRecord(\''+x.id+'\')">Delete</button></td></tr>').join('')}catch(e){msg.textContent=e.message}}async function removeRecord(id){if(confirm('Delete this record?')){await NAVYA_DATA.remove('subjects',id);await NAVYA_DATA.audit('DELETE','subjects',id);load()}}document.addEventListener('submit',async e=>{if(e.target.id!=='form')return;e.preventDefault();try{const d={};[["Subject","name"],["Code","code"],["Class","className"],["Department","department"]].forEach(f=>d[f[1]]=document.getElementById(f[1]).value.trim());await NAVYA_DATA.add('subjects',d);await NAVYA_DATA.audit('CREATE','subjects',null,d.title||d.name||'');e.target.reset();load();msg.textContent='Saved successfully.'}catch(x){msg.textContent=x.message}})</script></body></html>
