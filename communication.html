<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAVYA — Communication</title></head><body><div id="app"></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script src="navya_core.js"></script><script src="navya_data.js"></script><script src="navya_ui.js"></script><script>const s=NAVYA_UI.protect(["OWNER","ADMIN","HOD","TEACHER","STUDENT","PARENT","ACCOUNTANT","COUNSELOR"]);if(s){document.getElementById('app').innerHTML=NAVYA_UI.shell("Communication",s.role,s)+`<section class="card" style="margin-top:22px"><form id="f" class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div><label>Title</label><input class="input" id="title" placeholder="Title"></div><div><label>Audience</label><input class="input" id="audience" placeholder="Audience"></div><div><label>Message</label><input class="input" id="message" placeholder="Message"></div><div><label>Channel</label><input class="input" id="channel" placeholder="Channel"></div><div><label>Status</label><input class="input" id="status" placeholder="Status"></div><button class="btn" type="submit">Save</button></form><p id="m" class="muted"></p></section><section class="card" style="margin-top:16px;overflow:auto"><table class="table"><thead><tr><th>Title</th><th>Audience</th><th>Message</th><th>Channel</th><th>Status</th><th>Action</th></tr></thead><tbody id="r"></tbody></table></section>`+NAVYA_UI.close();load()}async function load(){try{const a=await NAVYA_DATA.list('messages');r.innerHTML=a.map(x=>'<tr>'+[["Title","title"],["Audience","audience"],["Message","message"],["Channel","channel"],["Status","status"]].map(f=>'<td>'+String(x[f[1]]??'')+'</td>').join('')+'<td><button class="btn secondary" onclick="del(\''+x.id+'\')">Delete</button></td></tr>').join('')}catch(e){m.textContent=e.message}}async function del(id){if(confirm('Delete?')){await NAVYA_DATA.remove('messages',id);load()}}f.onsubmit=async e=>{e.preventDefault();try{const d={};[["Title","title"],["Audience","audience"],["Message","message"],["Channel","channel"],["Status","status"]].forEach(x=>d[x[1]]=document.getElementById(x[1]).value.trim());await NAVYA_DATA.add('messages',d);e.target.reset();m.textContent='Saved successfully';load()}catch(x){m.textContent=x.message}}</script></body></html>
