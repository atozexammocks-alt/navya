<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAVYA — Students</title></head><body><div id="app"></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script><script src="firebase-config.js"></script><script src="navya_core.js"></script><script src="navya_data.js"></script><script src="navya_ui.js"></script><script>const s=NAVYA_UI.protect(["OWNER","ADMIN","HOD","TEACHER"]);if(s){document.getElementById('app').innerHTML=NAVYA_UI.shell("Students",s.role,s)+`<section class="card" style="margin-top:22px"><h2>Add</h2><form id="form" class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div><label>Name</label><input class="input" id="name" placeholder="Name"></div><div><label>Admission No.</label><input class="input" id="admissionNo" placeholder="Admission No."></div><div><label>Class / Batch</label><input class="input" id="batch" placeholder="Class / Batch"></div><div><label>Guardian</label><input class="input" id="guardian" placeholder="Guardian"></div><div><label>Mobile</label><input class="input" id="mobile" placeholder="Mobile"></div><button class="btn" type="submit">Save</button></form><div id="msg" class="muted" style="margin-top:10px"></div></section><section class="card" style="margin-top:16px;overflow:auto"><h2>Records</h2><table class="table"><thead><tr><th>Name</th><th>Admission No.</th><th>Class / Batch</th><th>Guardian</th><th>Mobile</th><th></th></tr></thead><tbody id="rows"></tbody></table></section>`+NAVYA_UI.close();load();}</script><script>async function load(){try{const a=await NAVYA_DATA.list('students');rows.innerHTML=a.map(x=>'<tr>'+[["Name","name"],["Admission No.","admissionNo"],["Class / Batch","batch"],["Guardian","guardian"],["Mobile","mobile"]].map(f=>'<td>'+String(x[f[1]]??'')+'</td>').join('')+'<td><button class="btn secondary" onclick="removeRecord(\''+x.id+'\')">Delete</button></td></tr>').join('')}catch(e){msg.textContent=e.message}}async function removeRecord(id){if(confirm('Delete this record?')){await NAVYA_DATA.remove('students',id);await NAVYA_DATA.audit('DELETE','students',id);load()}}document.addEventListener('submit',async e=>{if(e.target.id!=='form')return;e.preventDefault();try{const d={};[["Name","name"],["Admission No.","admissionNo"],["Class / Batch","batch"],["Guardian","guardian"],["Mobile","mobile"]].forEach(f=>d[f[1]]=document.getElementById(f[1]).value.trim());await NAVYA_DATA.add('students',d);await NAVYA_DATA.audit('CREATE','students',null,d.title||d.name||'');e.target.reset();load();msg.textContent='Saved successfully.'}catch(x){msg.textContent=x.message}})</script></body></html>
